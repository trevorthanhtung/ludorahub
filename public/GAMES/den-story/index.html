<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="ĐEN: The Story of Đen - Pixel Story / Indie Adventure prototype."
    />
    <title>ĐEN - The Story of Đen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=VT323&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: 'DearPix';
        src: url('./assets/dearpix.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
      }
      :root {
        color-scheme: dark;
        background: #050505;
        --den-font-ui: "DearPix", "Pixelify Sans", system-ui, sans-serif;
        --den-font-title: "Silkscreen", "DearPix", system-ui, sans-serif;
        --den-font-debug: "VT323", "DearPix", monospace;
        font-family: var(--den-font-ui);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050505;
      }

      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
      }

      #game {
        width: 100vw;
        height: 100svh;
        background: #050505;
      }

      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .den-loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #f6efe4;
        font-family: var(--den-font-title);
        font-size: clamp(1rem, 4vw, 1.35rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="game"><div class="den-loading">ĐEN</div></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script type="module" src="./src/main.js?v=one-time-intro-1"></script>
  </body>
</html>
